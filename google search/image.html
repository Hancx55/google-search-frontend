<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <title>Search</title>
    </head>
    <body>
        <nav>
            <a href="index.html">Text Search</a>
            <a class="open" href="image.html">Image Search</a>
            <a href="advance.html">Advanced Search</a>
        </nav>

        <section id="search">

            <div id="logo">
                <img src="images/googleLogo.jpg" alt="google logo">
            </div>
            
            <form id="google" action="https://www.google.com/images">
                <input id="searchBar" type="text" name="q">
                <div id="buttons">
                    <input id="submitBtn" type="submit" value="Google Search">
                    <input id="lucky btn" type="button" value="I'm feeling lucky">
                </div>
                
            </form>
            
        </section>
        
        
    </body>
</html>
