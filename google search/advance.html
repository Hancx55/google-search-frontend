<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <title>Search</title>
    </head>
    <body>
        <nav>
            <a href="index.html">Text Search</a>
            <a href="image.html">Image Search</a>
            <a class="open" href="advance.html">Advanced Search</a>
            <img src="images/googleLogo.jpg" alt="google logo">
        </nav>
        <hr>
        <section id="advSection">
            <h2>Advanced Search</h2>
            <p id="title">Find pages with:</p>
            
            <form action="https://www.google.com/search">
                <div id="advForm">
                    <div class="formItem">
                        <p>All of these words:</p>
                        <input type="text" name="q">
                    </div>
                    
                    <div class="formItem">
                        <p>This exact word or phrase:</p>
                        <input type="text" name="epq">
                    </div>

                    <div class="formItem">
                        <p>None of these words:</p>
                        <input type="text" name="eq">
                    </div>
                </div>

                <input id="advSubmit" type="submit" value="advanced search">
            </form>
        </section>
        
        
    </body>
</html>
